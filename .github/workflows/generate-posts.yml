name: Generate posts.json

on:
  push:
    branches: [main]
    paths:
      - 'Topics/**'
      - '.github/workflows/generate-posts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 파일이 처음 등록된 커밋 날짜를 얻기 위해 전체 이력 필요

      - name: Generate posts.json
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          ROOT = 'Topics'

          def added_date(path):
              """파일이 처음 추가된 커밋 날짜(YYYY-MM-DD). 없으면 마지막 커밋 날짜."""
              for args in (['--diff-filter=A', '--follow'], []):
                  try:
                      out = subprocess.check_output(
                          ['git', 'log'] + args + ['-1', '--format=%aI', '--', path],
                          text=True).strip()
                  except subprocess.CalledProcessError:
                      out = ''
                  if out:
                      return out[:10]
              return ''

          posts = []
          for root, dirs, files in os.walk(ROOT):
              for f in files:
                  if f.lower().endswith('.md'):
                      path = os.path.join(root, f).replace(os.sep, '/')
                      rel = path[len(ROOT) + 1:]
                      parts = rel.split('/')
                      category = parts[0] if len(parts) > 1 else '기타'
                      group = '/'.join(parts[1:-1]) if len(parts) > 2 else ''
                      posts.append({
                          'path': path,
                          'title': f[:-3],
                          'category': category,
                          'group': group,
                          'date': added_date(path),
                      })
          # 카테고리 → 최신 등록일 순
          posts.sort(key=lambda p: (p['category'], p['date'] == '', p['date']), reverse=False)
          posts.sort(key=lambda p: p['category'])
          with open('posts.json', 'w', encoding='utf-8') as fp:
              json.dump(posts, fp, ensure_ascii=False, indent=1)
          print(f'{len(posts)} posts')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "chore: update posts.json" && git push)
